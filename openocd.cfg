#source [find target/stm32f4x.cfg]
adapter speed 10000
#adapter speed 6000
#adapter speed 1000
#reset_config connect_assert_srst

#tpiu create $_TARGETNAME.tpiu -dap $_CHIPNAME.dap -ap-num 0x0
# for mculink, though I'm not sure it can actaully run at 16M?!
#$_TARGETNAME.tpiu configure -protocol uart -traceclk 120000000 -output :3443 -formatter 0 -pin-freq 16000
# jlink can autodetect (or not?)
#$_TARGETNAME.tpiu configure -protocol uart -traceclk 120000000 -output :3443 -formatter 0
